chat.prefix=&8[&6Coalitions&8] &r
command.create.usage=&cUsage: /co create <name> <prefix>
command.create.invalid_name=&cName must contain 2-24 characters: letters, numbers, _ or -.
command.prefix.too_long_with_codes=&cPrefix is too long (maximum %d characters including color codes).
command.create.exists=&cA coalition named &e%s &calready exists.
command.create.conflict=&cInternal identifier conflict. Choose a different name.
command.create.success=&aCoalition &e%s &acreated. Prefix: %s&r
command.create.leader_hint=&7Assign a leader: /co setleader %s <player>
command.setleader.usage=&cUsage: /co setleader <coalition_name> <player>
command.coalition.not_found=&cCoalition &e%s &cwas not found.
command.player.not_found=&cPlayer &e%s &cwas not found (they must be online or have joined the server before).
command.player.already_in_coalition=&cThat player is already in coalition &e%s&c.
command.player.already_leader=&eThat player is already the coalition leader.
command.setleader.success=&e%s &ais now the leader of coalition &e%s&a.
command.setleader.notification=&aYou are now the leader of coalition &e%s&a!
command.delete.usage=&cUsage: /co delete <name>
command.delete.success=&aCoalition &e%s &adeleted.
command.add.usage=&cUsage: /co add <player>
command.add.success=&e%s &aadded to the coalition.
command.add.notification=&aYou have been added to coalition &e%s&a.
command.kick.usage=&cUsage: /co kick <player>
command.kick.not_member=&cPlayer &e%s &cis not in your coalition.
command.kick.leader_denied=&cThe coalition leader cannot be removed.
command.kick.success=&e%s &aremoved from the coalition.
command.kick.notification=&cYou have been removed from coalition &e%s&c.
command.color.usage=&cUsage: /co color <color|code> (for example, gold or &6)
command.color.invalid=&cUnknown color. Enter an English color name or a code from 0 to f.
command.color.success=&aThe prefix color for coalition &e%s &ahas been changed.
command.prefix.usage=&cUsage: /co prefix <new_prefix>
command.prefix.too_long=&cPrefix is too long (maximum %d characters).
command.prefix.success=&aCoalition prefix changed to: %s&r
command.info.usage=&cUsage: /co info <name>
command.info.not_found=&cCoalition not found.
command.info.leader_unassigned=&7not assigned
command.info.title=&6Coalition &e%s &7(%s&7)
command.info.leader=&6Leader: %s
command.info.members=&6Members (%d): &f%s
help.title=&6Coalition commands:
help.info=&e/co info [name] &7- view coalition information
help.add=&e/co add <player> &7- add a player
help.kick=&e/co kick <player> &7- remove a player
help.color=&e/co color <color|code> &7- change the prefix color
help.prefix=&e/co prefix <text> &7- change the prefix
help.create=&e/co create <name> <prefix> &7- create a coalition
help.setleader=&e/co setleader <name> <player> &7- assign the leader
help.delete=&e/co delete <name> &7- delete a coalition
error.no_admin_permission=&cYou do not have permission to use this command.
error.player_only=&cThis command is only available to players.
error.leader_only=&cThis command is only available to coalition leaders.
color.black=black
