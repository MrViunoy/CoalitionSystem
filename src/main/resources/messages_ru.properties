chat.prefix=&8[&6Коалиции&8] &r
command.create.usage=&cИспользование: /co create <название> <префикс>
command.create.invalid_name=&cНазвание должно содержать 2-24 символа: буквы, цифры, _ или -.
command.prefix.too_long_with_codes=&cПрефикс слишком длинный (максимум %d символов вместе с кодами цветов).
command.create.exists=&cКоалиция с названием &e%s &cуже существует.
command.create.conflict=&cКонфликт внутреннего идентификатора. Выберите другое название.
command.create.success=&aКоалиция &e%s &aсоздана. Префикс: %s&r
command.create.leader_hint=&7Назначьте главу: /co setleader %s <ник>
command.setleader.usage=&cИспользование: /co setleader <название_коалиции> <ник_игрока>
command.coalition.not_found=&cКоалиция &e%s &cне найдена.
command.player.not_found=&cИгрок &e%s &cне найден (он должен быть в сети или раньше заходить на сервер).
command.player.already_in_coalition=&cИгрок уже состоит в коалиции &e%s&c.
command.player.already_leader=&eЭтот игрок уже является главой коалиции.
command.setleader.success=&e%s &aтеперь глава коалиции &e%s&a.
command.setleader.notification=&aВы назначены главой коалиции &e%s&a!
command.delete.usage=&cИспользование: /co delete <название>
command.delete.success=&aКоалиция &e%s &aудалена.
command.add.usage=&cИспользование: /co add <ник_игрока>
command.add.success=&e%s &aдобавлен в коалицию.
command.add.notification=&aВы добавлены в коалицию &e%s&a.
command.kick.usage=&cИспользование: /co kick <ник_игрока>
command.kick.not_member=&cИгрока &e%s &cнет в вашей коалиции.
command.kick.leader_denied=&cНельзя исключить главу коалиции.
command.kick.success=&e%s &aисключен из коалиции.
command.kick.notification=&cВы исключены из коалиции &e%s&c.
command.color.usage=&cИспользование: /co color <цвет|код> (например, золотой или &6)
command.color.invalid=&cНеизвестный цвет. Введите название по-русски или код от 0 до f.
command.color.success=&aЦвет префикса коалиции &e%s &aизменен.
command.prefix.usage=&cИспользование: /co prefix <новый_префикс>
command.prefix.too_long=&cПрефикс слишком длинный (максимум %d символов).
command.prefix.success=&aПрефикс коалиции изменен: %s&r
command.info.usage=&cИспользование: /co info <название>
command.info.not_found=&cКоалиция не найдена.
command.info.leader_unassigned=&7не назначен
command.info.title=&6Коалиция &e%s &7(%s&7)
command.info.leader=&6Глава: %s
command.info.members=&6Участники (%d): &f%s
help.title=&6Команды коалиций:
help.info=&e/co info [название] &7- информация о коалиции
help.add=&e/co add <ник> &7- добавить игрока
help.kick=&e/co kick <ник> &7- исключить игрока
help.color=&e/co color <цвет|код> &7- изменить цвет префикса
help.prefix=&e/co prefix <текст> &7- изменить префикс
help.create=&e/co create <название> <префикс> &7- создать коалицию
help.setleader=&e/co setleader <название> <ник> &7- назначить главу
help.delete=&e/co delete <название> &7- удалить коалицию
error.no_admin_permission=&cУ вас нет прав на эту команду.
error.player_only=&cЭта команда доступна только игрокам.
error.leader_only=&cЭта команда доступна только главам коалиций.
